<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="chief-web">
  <!--
    A tab icon is read at 16px, so this is one shape and two colours: the app's
    canvas as a rounded tile, and the accent diamond the wordmark uses. Detail
    finer than this turns to mush at favicon size.
  -->
  <rect width="32" height="32" rx="7" fill="#0d1117" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#30363d" />
  <path d="M16 7.5 24.5 16 16 24.5 7.5 16Z" fill="#58a6ff" />
  <path d="M16 12.5 19.5 16 16 19.5 12.5 16Z" fill="#0d1117" />
</svg>
