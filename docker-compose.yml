services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: chief-web:latest
    container_name: chief-web
    restart: unless-stopped
    ports:
      # Host port is configurable via .env; the container always listens on 8080.
      - "${CHIEF_WEB_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      CLAUDE_AUTH_DIR: /claude-auth
      # Name of the volume below. Containers the server spawns (the Claude
      # login and auth-probe containers, and every session container) mount it
      # by name: a bind mount of /claude-auth would be resolved on the host,
      # where that path does not exist.
      CLAUDE_AUTH_VOLUME: ${CLAUDE_AUTH_VOLUME:-chief-web-claude-auth}
      DOCKER_SOCKET: /var/run/docker.sock
      # Image used for session containers and short-lived helpers such as the
      # repository connection test (built by US-006).
      RUNNER_IMAGE: ${RUNNER_IMAGE:-chief-web-runner:latest}
      CHIEF_WEB_PASSWORD: ${CHIEF_WEB_PASSWORD:-}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Application data: SQLite database, SSH deploy keys, session workspaces.
      - chief-data:/data
      # Claude Code credentials, shared with every session container (FR-5).
      - claude-auth:/claude-auth
      # Lets the server spawn one container per session (FR-6).
      # WARNING: this grants root-equivalent control of the host. See README.
      - /var/run/docker.sock:/var/run/docker.sock

  # Image every session container (and the short-lived repository connection
  # test) runs. It is never started by compose — the server spawns containers
  # from it through the Docker socket — but it is part of the stack so that
  # `docker compose build` produces it and tags it as RUNNER_IMAGE.
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: ${RUNNER_IMAGE:-chief-web-runner:latest}
    # Built, never run by compose: the server starts containers from this image
    # itself, one per session.
    deploy:
      replicas: 0

volumes:
  chief-data:
  # Explicitly named rather than <project>_claude-auth, so the name the server
  # passes to `docker run` is knowable without inspecting the compose project.
  claude-auth:
    name: ${CLAUDE_AUTH_VOLUME:-chief-web-claude-auth}
